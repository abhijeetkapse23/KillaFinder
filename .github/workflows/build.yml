name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.abhijeetkapse23 --project-name fort_finder .
          fi
          rm -f test/widget_test.dart

      - name: Add location permission, app name and Maps link support
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Killa Finder"#' "$M"
          if ! grep -q 'android:scheme="https"' "$M"; then
            if grep -q '<queries>' "$M"; then
              sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>#' "$M"
            else
              sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n    </queries>\n</manifest>#' "$M"
            fi
          fi
          cat "$M"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Killa Finder build ${{ github.run_number }}
          body: Install this APK on your Android phone to test. (Test build, not for Play Store upload.)
          files: build/app/outputs/flutter-apk/app-release.apk
